# 第一部分 用户协议

## 第二条 用户使用规范

1、用户在使用本网站服务时，需遵守中华人民共和国相关法律法规，不得利用本网站发布、传播、储存违法违规、低俗色情、暴力恐怖、侵权、造谣、攻击他人、危害网络安全等不良信息。

2、用户自愿投稿、留言所提交的内容，必须为原创、无版权纠纷、无侵权内容，若因用户提交内容引发版权纠纷、法律追责，全部责任由用户自行承担，本网站不承担任何连带责任。

4、用户留言、投稿内容需积极正向，本站拥有对所有用户提交内容的审核、筛选、修改、删减、不予展示、下架删除的最终权利，无需提前告知用户。

## 第三条 投稿与留言规则

1、文章投稿：用户可自愿向本站**指定邮箱**投递原创文章，仅需主动提供**投稿昵称\+文章内容**，无其他强制信息要求。投稿即默认授权本站免费展示、发布、合理排版修改该文章内容，用户保留文章署名权。

2、留言互动：用户可自愿通过本站提供的**问卷星问卷**提交留言，留言所需填写信息以问卷页面公示内容为准，由用户自愿填写提交。

3、用户可自主选择是否投稿、是否留言，不提交任何信息不影响正常浏览本站内容。

## 第四条 版权声明

1、本站原创内容版权归本站运营者所有，未经授权，禁止任何人私自转载、篡改、商用、二次传播。

2、用户投稿内容版权归原作者所有，本站仅享有发布展示权限，未经作者同意不会将投稿内容用于商业用途。

3、若第三方发现本站内容存在侵权问题，可联系本站运营者核实，确认侵权后将第一时间删除相关内容。

## 第五条 免责声明

1、本网站为个人非盈利站点，仅提供内容分享服务，不对用户留言、投稿内容的真实性、完整性、有效性做任何担保，用户自行承担浏览、参考、使用相关内容的风险。

3、用户因自愿投稿、留言泄露自身隐私信息造成的一切损失，由用户自行承担，本站无过错不承担责任。

4、本站不承担第三方平台（问卷星、邮箱服务商）的服务故障、隐私风险、数据规则变动带来的任何责任。

// 下面代码请勿修改，负责解析markdown渲染页面
if (window.marked && typeof window.marked.parse === 'function') {
    marked.setOptions({
        gfm:true,
        breaks:true
    });
    document.getElementById('mainContent').innerHTML = marked.parse(MARKDOWN_CONTENT);
} else if (window.markdownLite && typeof window.markdownLite.parse === 'function') {
    document.getElementById('mainContent').innerHTML = window.markdownLite.parse(MARKDOWN_CONTENT);
} else {
    document.getElementById('mainContent').textContent = '内容加载失败，请检查网络或脚本权限。';
}
